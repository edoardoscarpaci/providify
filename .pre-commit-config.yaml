repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.1
    hooks:
      - id: ruff
        args: [--fix --format]  # Auto-fix what it can

  ## Optional: also auto-format with black
  #- repo: https://github.com/psf/black
  #  rev: 24.3.0
  #  hooks:
  #    - id: black

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: sh -c 'cd tests && poetry lock && poetry install && cd .. && poetry run pytest tests/'
        args: [--tb=short, -q]
        language: system
        pass_filenames: false  # Don't pass staged filenames to pytest
        always_run: true       # Run even if no Python files changed