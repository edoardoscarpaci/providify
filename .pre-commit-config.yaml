repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Bumped to match the root [dependency-groups] lint pin (RL-6, plan 017)
    # — v0.4.1 predates rule codes now referenced in [tool.ruff.lint]
    # (UP046/UP047), so it failed to parse the config at all.
    rev: v0.16.4
    hooks:
      # `ruff-check`, not the bare `ruff` id — the latter is a legacy alias
      # that pre-commit reports as "ruff (legacy alias)" and that upstream
      # intends to retire.
      - id: ruff-check
        args: [--fix]
      # Must run AFTER `ruff` — an autofix can leave a line the formatter then
      # rewraps, and pre-commit runs hooks top-to-bottom within a repo block.
      - id: ruff-format

  ## Optional: also auto-format with black
  #- repo: https://github.com/psf/black
  #  rev: 24.3.0
  #  hooks:
  #    - id: black

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: sh -c 'cd tests && poetry lock && poetry install && cd .. && poetry run pytest tests/'
        args: [--tb=short, -q]
        language: system
        pass_filenames: false  # Don't pass staged filenames to pytest
        always_run: true       # Run even if no Python files changed