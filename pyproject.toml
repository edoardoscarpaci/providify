[project]
name = "providify"
version = "2.1.1"
description = "A Python dependency injection container inspired by Jakarta CDI and Spring. Supports sync and async resolution, multiple scopes, lifecycle hooks, and configuration modules."
authors = [
    {name = "edoardo.scarpaci", email = "edoardo.scarpaci@gmail.com"},
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "dependency injection",
    "di",
    "ioc",
    "inversion of control",
    "container",
    "async",
    "jakarta",
    "spring",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/edoardoscarpaci/providify"
Repository = "https://github.com/edoardoscarpaci/providify"
Documentation = "https://github.com/edoardoscarpaci/providify#readme"
Changelog = "https://github.com/edoardoscarpaci/providify/blob/main/CHANGELOG.md"
Issues = "https://github.com/edoardoscarpaci/providify/issues"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]

[project.entry-points.pytest11]
providify = "providify.pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "PyYAML>=6.0",
    "pydantic>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["providify"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501: line-length is enforced by the formatter, not the linter.
# UP046/UP047: flag `Generic[T]` subclasses and generic functions that predate
# PEP 695 `class Foo[T]:` / `def foo[T]` syntax. Migrating providify's public
# generic API (Component/Provider/Singleton/... decorators, LazyProxy,
# InstanceProxy, EventProxy, ...) is a real but separate piece of work, not a
# v2.0.0 packaging-release change — ignored here rather than silently drifting
# to red the moment the CI lint gate (Phase 5a) lands.
ignore = ["E501", "UP046", "UP047"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
